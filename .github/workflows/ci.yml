# Test harness for #54 fix-loop RED path: intentionally fails so fixowl's
# CI gate sees a red required/completed check on the PR head SHA, feeds the
# failure back to the agent, retries up to max-ci-tries, and leaves an
# annotated DRAFT (fixowl never merges). Revert to `echo ok` after the test.
name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  ok:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::intentional red for the #54 fix-loop red-path test"
          exit 1
