# Trivial PR CI for the fixowl e2e sandbox. fixowl opens PRs here with a PAT
# (not the default GITHUB_TOKEN), so this workflow DOES fire, gives the CI gate
# a real check to wait on, and goes green - flipping the draft PR to ready.
name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  ok:
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
